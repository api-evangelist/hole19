name: Hole19
description: Hole19 (Stat Track Technologies Lda) is a golf app for iOS, Android, and smartwatches
  used by 4.8M+ golfers across 42,000+ golf courses in 200+ countries. It provides GPS rangefinder
  distances, digital scorecards, shot tracking, performance statistics, an Otto AI game assistant, and a
  WHS handicap calculator, plus social features such as LivePlay live leaderboards and a social feed. The
  company also ships CORE Golf, a practice app with structured plans and 100+ drills, and operates a
  worldwide golf course directory, a golf glossary, and The 19th Hole magazine. The core app is free with
  two subscription tiers, Premium and Intelligence. Hole19 does not publish a public developer API; this
  profile captures its public web, legal, support, and llms.txt surface.
